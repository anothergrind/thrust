name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The CLI makes an initial commit in the projects it generates, which
      # needs an identity the runners don't set up.
      - name: Give git an identity
        run: |
          git config --global user.name "thrust CI"
          git config --global user.email "ci@example.com"
      - run: npm ci
      - run: npm test

  generate:
    name: Generate ${{ matrix.stack }} + ${{ matrix.frontend }} + ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every backend against the default frontend, plus each alternative
      # frontend against one backend. The frontends differ only in what lands
      # in client/, so crossing all of them with all backends would spend
      # runner time re-proving the same seam.
      matrix:
        include:
          - { stack: typescript, frontend: next, db: none, auth: false }
          - { stack: python, frontend: next, db: none, auth: false }
          - { stack: springboot, frontend: next, db: none, auth: false }
          - { stack: nextjs, frontend: next, db: none, auth: false }
          - { stack: typescript, frontend: svelte, db: none, auth: false }
          - { stack: typescript, frontend: vue, db: none, auth: false }
          # Both optional layers at once, on the database engine that needs no
          # server running. Postgres and MySQL get their own job below, where
          # there is a server to talk to.
          - { stack: typescript, frontend: next, db: sqlite, auth: true }
          - { stack: python, frontend: next, db: sqlite, auth: true }
          - { stack: springboot, frontend: next, db: sqlite, auth: true }
          - { stack: nextjs, frontend: next, db: sqlite, auth: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: matrix.stack == 'python'
        with:
          python-version: "3.12"
      # The template's pom targets Java 17.
      - uses: actions/setup-java@v4
        if: matrix.stack == 'springboot'
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      # Scaffolds the stack, installs it, boots `npm run dev`, and asserts
      # /api/health, CORS and the rendered page.
      - name: Smoke test
        run: >-
          npm run smoke --
          --stack=${{ matrix.stack }}
          --frontend=${{ matrix.frontend }}
          --db=${{ matrix.db }}
          ${{ matrix.auth && '--auth' || '' }}
        timeout-minutes: 25

  services:
    name: ${{ matrix.stack }} + ${{ matrix.db }} + ${{ matrix.storage }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Postgres against every backend, since that is the engine the hosted
      # options (Supabase, Neon, RDS) all speak. MySQL differs from it by a
      # driver and a URL, so it rides on the two stacks whose drivers differ
      # most — Prisma's and SQLAlchemy's.
      #
      # MongoDB is a different data layer on every stack rather than a driver
      # swap, so it gets all four; S3 rides along with it, which also puts two
      # services in one compose file. The last row is storage on its own.
      matrix:
        include:
          - { stack: typescript, db: postgres, storage: none }
          - { stack: python, db: postgres, storage: none }
          - { stack: springboot, db: postgres, storage: none }
          - { stack: nextjs, db: postgres, storage: none }
          - { stack: typescript, db: mysql, storage: none }
          - { stack: python, db: mysql, storage: none }
          - { stack: typescript, db: mongodb, storage: s3 }
          - { stack: python, db: mongodb, storage: s3 }
          - { stack: springboot, db: mongodb, storage: s3 }
          - { stack: nextjs, db: mongodb, storage: s3 }
          - { stack: typescript, db: none, storage: s3 }
    # No service containers: the database and the object store both come from
    # the project's own compose file, started by the `npm run docker:up` the
    # CLI printed. What is under test is then the setup a developer is actually
    # handed, rather than services stood up beside it with credentials CI
    # invented.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: matrix.stack == 'python'
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        if: matrix.stack == 'springboot'
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      # Scaffolds, starts the services with `npm run docker:up`, pushes the
      # schema, boots the app, and round-trips a row through /api/items and a
      # file through /api/files.
      - name: Smoke test
        run: >-
          npm run smoke --
          --stack=${{ matrix.stack }}
          --db=${{ matrix.db }}
          --storage=${{ matrix.storage }}
        timeout-minutes: 25
