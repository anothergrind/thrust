storage:
  image: minio/minio
  restart: unless-stopped
  command: ["server", "/data", "--console-address", ":9001"]
  environment:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
  ports:
    # The S3 API, which S3_ENDPOINT points at.
    - "9000:9000"
    # The web console: http://localhost:9001, same credentials.
    - "9001:9001"
  volumes:
    - storage-data:/data
  # No healthcheck on purpose: the server image carries no curl to run one
  # with, and the app creates its bucket on startup, retrying until MinIO
  # answers — so there is nothing here for `--wait` to add.
