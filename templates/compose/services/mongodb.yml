db:
  image: mongo:7
  restart: unless-stopped
  # A replica set of one. Prisma's MongoDB connector refuses a standalone
  # server, and this is the smallest thing that isn't one.
  command: ["--replSet", "rs0", "--bind_ip_all"]
  ports:
    - "27017:27017"
  volumes:
    - db-data:/data/db
  healthcheck:
    # The check is also what creates the replica set: mongod is up long before
    # rs0 exists, and nothing else is going to initiate it. It advertises
    # localhost because your app connects from outside Docker, not from within.
    test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}).ok }'"]
    interval: 5s
    timeout: 10s
    retries: 20
    start_period: 30s
