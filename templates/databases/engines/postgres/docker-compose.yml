# The database `npm run db:up` starts. Everything here matches the
# DATABASE_URL already in your .env — same user, same password, same database
# name, same port — so the two never have to be kept in step by hand.
#
# `npm run db:up` waits until the server is actually accepting connections,
# and `npm run db:down` stops it while keeping your data in the named volume.
# Point DATABASE_URL at a hosted database instead and you can ignore this file.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: __PROJECT_NAME__
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the socket: during its first-run setup Postgres answers
      # on the socket while still refusing the connections your app will make.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d __PROJECT_NAME__"]
      interval: 5s
      timeout: 5s
      retries: 20
      # First-run setup creates the database before it starts listening, and
      # on a cold machine that is most of the wait. Failures before this are
      # not counted against the retries.
      start_period: 30s

volumes:
  db-data:
